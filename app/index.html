<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Crumb</title>
<!-- Paths are relative: the app is served at the site root, but the same files are also
     published as static pages under /crumb/app/ on GitHub Pages, where no server answers. -->
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<!-- The home-screen icon. The manifest keeps it opening in the browser, which holds the
     sign-in: a separate web app keeps its own storage and would start signed out. -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="app.css">
<!-- The pixel table is a classic script defining one global; the app reads it through pixels.js.
     Deferred classic scripts and module scripts run in document order, so it is ready first. -->
<script src="../assets/sprites.js" defer></script>
<script type="module" src="main.js"></script>
</head>
<body>
<div id="app"><p class="boot">Loading Crumb… · 正在加载 Crumb…</p></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<noscript><p class="boot">Crumb needs JavaScript to run. · Crumb 需要启用 JavaScript 才能运行。</p></noscript>
</body>
</html>
