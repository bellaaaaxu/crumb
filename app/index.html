<!doctype html>

<head>

<title>Crumb</title>

<link rel="stylesheet" href="/app.css">
<!-- The pixel table is a classic script defining one global; the app reads it through pixels.js.

<script src="/assets/sprites.js" defer></script>
<script type="module" src="/main.js"></script>
</head>
<body>
<div id="app"><p class="boot">Loading Crumb… · 正在加载 Crumb…</p></div>
<div id="toasts" class="toasts" role="status" aria-live="polite"></div>
<noscript><p class="boot">Crumb needs JavaScript to run. · Crumb 需要启用 JavaScript 才能运行。</p></noscript>
</body>
</html>
